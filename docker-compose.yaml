services:
  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
      - '9229:9229'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: sh -c "pnpm run build && node ./node_modules/typeorm/cli.js -d dist/core/database/data-source.js migration:run && pnpm run start:dev"

  database:
    image: postgres:17-alpine
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
